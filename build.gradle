plugins {
    id 'java'
    id "com.vanniktech.maven.publish" version "0.36.0"
}

group = 'tech.blueglacier'
version = '1.0.7'

repositories {
    mavenCentral()
}

dependencies {
    implementation([group: 'javax.mail', name: 'mail', version: '1.5.0-b01'],
            [group: 'net.freeutils', name: 'jcharset', version: '2.1'],
            [group: 'org.apache.james', name: 'apache-mime4j-core', version: '0.8.6'],
            [group: 'org.apache.james', name: 'apache-mime4j-dom', version: '0.8.6'],
            [group: 'org.apache.james', name: 'apache-mime4j-storage', version: '0.8.6'],
            [group: 'org.apache.james', name: 'apache-mime4j-mbox-iterator', version: '0.8.6'],
            [group: 'commons-codec', name: 'commons-codec', version: '1.18.0'],
            [group: 'commons-beanutils', name: 'commons-beanutils', version: '1.9.4'],
            [group: 'org.apache.commons', name: 'commons-configuration2', version: '2.12.0'],
            [group: 'ch.qos.logback', name: 'logback-core', version: '1.5.18'],
            [group: 'org.slf4j', name: 'slf4j-api', version: '2.0.17'],
            [group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.17'],
            [group: 'commons-collections', name: 'commons-collections', version: '3.2.2'],
            [group: 'com.google.guava', name: 'guava', version: '33.4.6-jre']
    )
    testImplementation([group: 'org.testng', name: 'testng', version: '7.11.0'],
            [group: 'org.mockito', name: 'mockito-core', version: '5.16.1'],
            [group: 'org.slf4j', name: 'slf4j-api', version: '2.0.17'],
            [group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.17'])
}

test {
    useTestNG()
    testLogging.showCauses = true;
    testLogging.showExceptions = true;
    testLogging.showStackTraces = true;
    testLogging.showStandardStreams = true;
    testLogging.exceptionFormat = 'full';
    testLogging.events "started", "passed", "skipped", "failed", "standardOut", "standardError";
}

task copyDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into 'build/dependencies'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}

mavenPublishing {
    coordinates("tech.blueglacier", "email-mime-parser", "1.0.7")

    pom {
        name = "email-mime-parser"
        description = "A mime4j based simplified email mime parser for java."
        inceptionYear = "2016"
        url = "https://github.com/ram-sharma-6453/email-mime-parser"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "ram-sharma-6453"
                name = "ram-sharma-6453"
                url = "https://github.com/ram-sharma-6453"
            }
        }
        scm {
            url = "https://github.com/ram-sharma-6453/email-mime-parser"
            connection = "scm:git:git://github.com/ram-sharma-6453/email-mime-parser.git"
            developerConnection = "scm:git:ssh://git@github.com/ram-sharma-6453/email-mime-parser.git"
        }
    }
}

javadoc {
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
}

